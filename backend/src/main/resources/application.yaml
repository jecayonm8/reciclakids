ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.example.com.reciclakids.plugins.RoutingKt.configureRouting

reciclakids:
  correos:
    # Vista previa de las plantillas de correo con datos ficticios en /correos/vista-previa/...
