# Backend y PostgreSQL en local, para probar la app contra la API sin nube:
#   docker compose up --build
# La API queda en http://localhost:8080 (desde el emulador de Android: http://10.0.2.2:8080).
# Los correos no salen: se guardan en memoria (CORREO_PROVEEDOR=memoria).
services:
  bd:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reciclakids
      POSTGRES_USER: reciclakids
      POSTGRES_PASSWORD: reciclakids
    ports:
      - "5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reciclakids -d reciclakids"]
      interval: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      bd:
        condition: service_healthy
    environment:
      RECICLAKIDS_ENTORNO: desarrollo
      RECICLAKIDS_URL_PUBLICA: http://localhost:8080
      DATABASE_URL: jdbc:postgresql://bd:5432/reciclakids
      DATABASE_USER: reciclakids
      DATABASE_PASSWORD: reciclakids
      JWT_SECRET: solo-para-desarrollo-local-no-usar-en-produccion
      CORREO_PROVEEDOR: memoria
      TAREAS_CLAVE: clave-de-tareas-solo-para-desarrollo
    ports:
      - "8080:8080"

volumes:
  datos:
