name: Android CI

on:
  pull_request:
    paths:
      - "app-movil/**"
      - ".github/workflows/android-ci.yml"
      - ".github/testrail/**"
  push:
    branches: [main]
    paths:
      - "app-movil/**"
      - ".github/workflows/android-ci.yml"
      - ".github/testrail/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      HAS_TESTRAIL: ${{ secrets.TESTRAIL_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build y pruebas
        working-directory: app-movil
        run: ./gradlew build testDebugUnitTest

      - name: Instalar TestRail CLI
        if: always() && github.event_name == 'push' && env.HAS_TESTRAIL == 'true'
        continue-on-error: true
        run: pip install trcli

      - name: Subir resultados a TestRail
        if: always() && github.event_name == 'push' && env.HAS_TESTRAIL == 'true'
        continue-on-error: true
        env:
          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
        # Un resultado por caso legible (CP-001…): el guion resume las pruebas automáticas de
        # cada caso según .github/testrail/casos-automatizados.json y trcli lo asocia al caso que
        # ya existe por su ID [C123], sin crear casos técnicos. Si falla, deja un aviso en la
        # corrida (continue-on-error la mantiene en verde).
        run: |
          if ! python3 .github/testrail/resultados_por_caso.py --proyecto app \
               --resultados app-movil/app/build/test-results/testDebugUnitTest --salida resultados-testrail.xml \
             || ! trcli -y -h "$TESTRAIL_URL" --project "ReciclaKids" \
               -u "$TESTRAIL_USER" -k "$TESTRAIL_API_KEY" \
               parse_junit --case-matcher name --title "CI app movil #${{ github.run_number }}" \
               -f resultados-testrail.xml; then
            echo "::warning title=TestRail::No se pudieron subir los resultados a TestRail. Revisa el registro del paso «Subir resultados a TestRail»."
            exit 1
          fi
