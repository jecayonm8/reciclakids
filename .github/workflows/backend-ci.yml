name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      HAS_TESTRAIL: ${{ secrets.TESTRAIL_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      # El daemon de Gradle pide JDK 25 y el código compila con la toolchain 21.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: |
            21
            25

      # Las pruebas de integración levantan PostgreSQL con Testcontainers (Docker ya viene en el runner).
      - name: Build y pruebas
        working-directory: backend
        run: ./gradlew build test koverVerify

      - name: Instalar TestRail CLI
        if: always() && github.event_name == 'push' && env.HAS_TESTRAIL == 'true'
        continue-on-error: true
        run: pip install trcli

      - name: Subir resultados a TestRail
        if: always() && github.event_name == 'push' && env.HAS_TESTRAIL == 'true'
        continue-on-error: true
        env:
          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
        run: |
          trcli -y -h "$TESTRAIL_URL" --project "ReciclaKids" \
            -u "$TESTRAIL_USER" -k "$TESTRAIL_API_KEY" \
            parse_junit --title "CI backend #${{ github.run_number }}" \
            -f "backend/build/test-results/test/**/*.xml"
