jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      HAS_TESTRAIL: ${{ secrets.TESTRAIL_URL != '' }}
    steps:
      # ... checkout, setup-java y "Build y pruebas" como ya los tienes ...

      - name: Instalar TestRail CLI
        if: always() && github.event_name == 'push' && env.HAS_TESTRAIL == 'true'
        continue-on-error: true
        run: pip install trcli

      - name: Subir resultados a TestRail
        if: always() && github.event_name == 'push' && env.HAS_TESTRAIL == 'true'
        continue-on-error: true
        env:
          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
        run: |
          trcli -y -h "$TESTRAIL_URL" --project "ReciclaKids" \
            -u "$TESTRAIL_USER" -k "$TESTRAIL_API_KEY" \
            parse_junit --title "CI backend #${{ github.run_number }}" \
            -f "backend/build/test-results/test/**/*.xml"
